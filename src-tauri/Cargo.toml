[package]
name = "ac-linux-launcher"
version = "0.1.0"
edition = "2021"
description = "Linux-native launcher for Assetto Corsa (Proton)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ac-core = { path = "../crates/ac-core" }

[lib]
name = "ac_linux_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
